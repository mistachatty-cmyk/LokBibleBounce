[package]
name = "lokbiblebounce"
version = "0.1.0"
description = "A Bible companion for the Lok ecosystem"
authors = ["LokBibleBounce contributors"]
license = ""
repository = "https://github.com/mistachatty-cmyk/LokBibleBounce"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lokbiblebounce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
